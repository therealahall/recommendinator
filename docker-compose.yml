# Recommendinator — Docker Compose
#
# This file pulls pre-built images from GitHub Container Registry and is the
# same compose file used by maintainers locally. For end users it is the
# canonical deployment manifest; download it via:
#
#   curl -L https://github.com/therealahall/recommendinator/releases/latest/download/docker-compose.yml \
#     -o docker-compose.yml
#
# Usage:
#   docker compose up -d                            # default variant (no AI)
#   docker compose --profile ai up -d app-ai        # AI variant + Ollama sidecar
#
# The AI invocation must name `app-ai` explicitly. The default `app` service
# has no profile so it always starts unless excluded by service-name selection;
# omitting `app-ai` leaves both variants competing for the same host port.
#
# Environment overrides (set in your shell or a .env file next to this file):
#   TZ                      — timezone the app containers run in, e.g.
#                             "America/Los_Angeles" (default: unset, meaning
#                             UTC). Watch and read timestamps arrive as UTC
#                             instants and are dated by the calendar day in this
#                             zone, so set it to your own or an evening watch is
#                             dated a day forward west of UTC.
#   IMAGE_TAG               — image tag to pull (default: latest)
#   APP_PORT                — host port to expose the web UI on (default: 18473)
#   APP_BIND_PREFIX         — host interface to publish that port on, written
#                             WITH a trailing colon (default: "127.0.0.1:", so
#                             the app is reachable from this host only). Set it
#                             empty to publish on every interface, or to an
#                             address to pick one. The app never serves TLS and
#                             a bearer token over plain HTTP crosses the network
#                             in cleartext, so anything beyond loopback belongs
#                             behind a reverse proxy that terminates HTTPS.
#   OLLAMA_MODEL            — model the sidecar pulls (default: mistral:7b)
#   OLLAMA_EMBEDDING_MODEL  — embedding model to pull (default: nomic-embed-text)
#   OLLAMA_CONVERSATION_MODEL — separate chat model to pull (default: reuse OLLAMA_MODEL)
#   OLLAMA_MEMORY_LIMIT     — memory ceiling for the sidecar (default: 12g, which
#                             holds every model docs/MODEL_RECOMMENDATIONS.md
#                             names). Raise it for a larger model: past the
#                             ceiling the kernel kills the model load, which on a
#                             NAS or a Pi is still better than killing the host.
#
# For local development with hot reload, layer docker-compose.dev.yml on top:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile ai up -d app-ai

x-app-common: &app-common
  environment:
    # A container has no timezone of its own — it runs on UTC unless TZ is set
    # inside it, and compose only carries a host variable in when the file names
    # it. Empty by default so a host that sets nothing keeps UTC exactly as
    # before; the app dates completions by this zone's calendar day.
    - TZ=${TZ:-}
  ports:
    # A prefix, not an address, because the every-interface publish is the
    # ABSENCE of a host part: the long `host_ip:` form cannot express that at
    # all (compose rejects an empty one with "invalid ip address"), and
    # spelling 0.0.0.0 silently drops the IPv6 binding. Hence the trailing
    # colon in the value. `-` and not `:-`, so `APP_BIND_PREFIX=` is honoured
    # as the opt-in to every interface rather than read as unset.
    - "${APP_BIND_PREFIX-127.0.0.1:}${APP_PORT:-18473}:8000"
  volumes:
    # config is mounted read-write so the entrypoint can copy example.yaml to
    # config.yaml on first run. Under Docker it holds only the storage paths
    # and web.debug — the bind comes from the image's --host/--port CMD, which
    # beats config.yaml, so set APP_PORT above rather than editing web.port.
    # Sources, settings, and secrets live in the database under ./data and are
    # managed from the app.
    # Once config.yaml exists, you can switch this to `./config:/app/config:ro`
    # for a tighter security posture (the app never needs to write to it
    # at steady state).
    - ./config:/app/config
    # persistent application data (SQLite DB, ChromaDB, credential keys)
    - ./data:/app/data
    # input files for ingestion sources
    - ./inputs:/app/inputs:ro
    # optional private plugin directory; leave empty if you don't have any
    - ./private:/app/private:ro
  restart: unless-stopped
  # The image already runs as an unprivileged user and binds a high port, so it
  # needs no capability and nothing in it should be able to acquire one. There
  # is no authentication in front of the app (docs/SECURITY.md), which is what
  # makes the blast radius of a compromised dependency worth shrinking here.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - recommendinator-net

services:
  # Default variant — no AI dependencies. Smallest image.
  app:
    <<: *app-common
    image: ghcr.io/therealahall/recommendinator:${IMAGE_TAG:-latest}
    container_name: recommendinator

  # AI variant — includes Ollama client and ChromaDB. Requires the ollama
  # sidecar below; only starts under the `ai` profile.
  app-ai:
    <<: *app-common
    image: ghcr.io/therealahall/recommendinator:${IMAGE_TAG:-latest}-ai
    container_name: recommendinator-ai
    profiles: ["ai"]
    environment:
      # A YAML merge key replaces `environment` wholesale rather than appending
      # to the anchor's list, so TZ has to be repeated here to survive.
      - TZ=${TZ:-}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  # Ollama LLM sidecar (only starts with --profile ai).
  # Models are auto-pulled on first start from the environment below. The app's
  # global config is database-backed, so these are set here rather than read
  # from config.yaml — keep them in sync with the ollama.model /
  # ollama.embedding_model settings on the Settings page.
  ollama:
    image: ghcr.io/therealahall/recommendinator-ollama:${IMAGE_TAG:-latest}
    container_name: recommendinator-ollama
    profiles: ["ai"]
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral:7b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # Only set this if you point ollama.conversation_model at a separate chat
      # model; empty means the sidecar reuses OLLAMA_MODEL, matching the app.
      - OLLAMA_CONVERSATION_MODEL=${OLLAMA_CONVERSATION_MODEL:-}
    volumes:
      # The image runs as the `ollama` user, and this is that user's model
      # store. See docs/DOCKER.md for the one-time chown when upgrading from a
      # sidecar that ran as root.
      - ollama-data:/var/lib/ollama/.ollama
    # The liveness check ships in the image, so `docker run` gets it too.
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-12g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - recommendinator-net
    # Uncomment for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-data:
    name: recommendinator-ollama-data

networks:
  recommendinator-net:
    name: recommendinator-network
