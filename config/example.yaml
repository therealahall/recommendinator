# Example configuration file.
#
# Copy this to config.yaml and modify as needed. When running via Docker
# (docker compose up), the container's entrypoint copies this file to
# config.yaml automatically on first run if config.yaml is missing — so
# edit ./config/config.yaml on the host directly, not example.yaml.
#
# This file holds ONLY what is needed to stand the app up: where the web server
# binds, and where the database lives. Both are read before the database is
# open, which is the sole reason they are still here.
#
# Everything else is managed from inside the app and stored in the database:
#
#   * Global settings — features, ollama, recommendations, conversation, sync,
#     enrichment, logging, and CORS origins. Settings page, or the `settings`
#     CLI (`python3.11 -m src.cli settings --help`).
#   * Data sources — Data tab -> "+ Add source", or the `source` CLI
#     (`python3.11 -m src.cli source create <id> <plugin>`). See
#     docs/DATA_SOURCES.md for the available plugins and their fields.
#   * API keys, passwords, and tokens — NEVER in this file. They are stored
#     encrypted in the credentials table and entered in the Add-source modal, a
#     connect flow (Data tab), or via `source set-secret` / `settings
#     set-secret`.
#
# Global settings resolve as: built-in default < this file < database. You MAY
# add a global section here to change a value before anything has been saved to
# the database, but you never need to, and the database wins once it has one.

# Web server bind settings and the API token.
# BOOTSTRAP: read to open the listening socket before the database exists, so
# these cannot be managed from the Settings page.
web:
  # REQUIRED. Every /api request must carry `Authorization: Bearer <token>`,
  # and the server refuses to start until this is set. Generate one with
  # `openssl rand -hex 32`; at least 32 characters. Under Docker the
  # entrypoint fills this in on first run and prints it once.
  api_token: ""
  # "127.0.0.1" binds to localhost only (recommended). "0.0.0.0" allows LAN
  # access — the token is then crossing your network in cleartext, because
  # this app never serves TLS. Put a reverse proxy in front of it instead.
  host: "127.0.0.1"
  port: 18473  # Non-standard port to avoid collisions with other services
  # Development only: enables auto-reload on file changes AND exposes the
  # OpenAPI docs at /docs and /redoc. Leave false for any reachable instance.
  debug: false
#
# Under Docker `host` and `port` are IGNORED: the image's command line passes
# --host 0.0.0.0 --port 8000 explicitly, and CLI flags win. Change the published
# port with the APP_PORT environment variable instead. `debug` and `api_token`
# ARE still honoured in the container — leave debug false, or /docs and /redoc
# get published on that 0.0.0.0 bind. See docs/DOCKER.md.

# Storage paths.
# BOOTSTRAP: these locate the database itself.
storage:
  # SQLite database path
  database_path: "data/recommendations.db"

  # Vector database (ChromaDB) path
  vector_db_path: "data/chroma_db"

  # Cache directory
  cache_dir: "data/cache"

# Where file-based sources (CSV/JSON/Markdown import, ROM scan) may read.
# BOOTSTRAP: source config is writable over the API, so this list is
# deliberately NOT manageable from the Settings page — a caller who could widen
# it could make the server read any file and import it into your library.
# Paths are resolved (symlinks followed) and must contain the configured path.
# Defaults to ["inputs"] when the section is absent. An empty list allows none.
#security:
#  allowed_source_roots:
#    - "inputs"
