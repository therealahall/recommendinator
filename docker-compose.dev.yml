# Recommendinator — Local development override.
#
# Layer this on top of docker-compose.yml when iterating on app code:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# What it does (vs. the production compose):
#   - Builds the image locally instead of pulling from GHCR (so your changes
#     to dependencies, the Dockerfile, or the frontend build are reflected).
#   - Bind-mounts ./src and ./templates into the container so Python edits
#     are visible immediately. Combined with --reload, uvicorn restarts in
#     ~1s on file save — no rebuild needed. The built frontend under
#     src/web/static/dist is exempted from that mount, so the container serves
#     the UI it built even on a fresh clone that has never run pnpm.
#   - Bind-mounts pyproject.toml so the runtime __version__ reflects the
#     host's current value after semantic-release bumps it (without
#     rebuilding the image). See src/__init__.py:_read_source_version.
#   - Renames the local image so it doesn't shadow the GHCR cache when you
#     switch back to the production compose.
#
# Frontend hot reload is run on the host with `pnpm dev` (port 5173) — see
# CONTRIBUTING.md.
#
# Your gitignored docker-compose.override.yml (private plugin mounts, etc.)
# still merges automatically, so all three files compose cleanly.

services:
  app:
    build:
      context: .
    image: recommendinator:dev
    volumes:
      - ./src:/app/src
      # The image builds the Vue bundle into this path and the host's copy is
      # gitignored, so the mount above would otherwise serve a blank page. An
      # anonymous volume keeps the image's copy; it outlives a rebuild, so pass
      # --renew-anon-volumes when the frontend has changed.
      - /app/src/web/static/dist
      - ./templates:/app/templates
      - ./pyproject.toml:/app/pyproject.toml:ro
    command:
      - python
      - -m
      - src.web
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    environment:
      - PYTHONUNBUFFERED=1
