name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two contexts report here: `check / check` (the gate on 3.11) and
  # `check / interpreters` (Python checks on 3.12-3.14). Branch protection
  # still names the pre-move context, so no merge passes until settings are
  # edited — and `interpreters` blocks nothing unless added there too.
  check:
    uses: ./.github/workflows/quality-gate.yml
