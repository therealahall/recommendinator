name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection must require `check / check`: this job's name, then the
  # job inside the reusable workflow. The name changed when the gate moved
  # there, so the rule needs editing in settings — until it is, no merge passes.
  check:
    uses: ./.github/workflows/quality-gate.yml
