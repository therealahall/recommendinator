name: Dependency audit

# Not a step in quality-gate.yml: that gates the tag push too, so a fresh
# advisory — or a feed merely down — would withhold the image for a commit CI
# already passed. An advisory is news about code that merged days ago.
on:
  pull_request:
    branches: [main]
  schedule:
    # Off the hour, where every other repository's cron is queued.
    - cron: "23 6 * * 1"

concurrency:
  group: audit-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Extras included: a vulnerable dev tool still runs on this runner.
      - name: Export what uv.lock pins
        run: uv export --locked --all-extras --no-emit-project --no-hashes --output-file requirements-audit.txt

      # No severity floor, unlike the frontend: PyPI advisories often carry no
      # severity, so filtering on one waves an unrated critical through.
      - name: Audit the Python lockfile
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-audit.txt
          no-deps: true
          # An advisory with no fixed release goes here, reason above it. The
          # frontend's waiver is `pnpm.auditConfig.ignoreCves` in package.json.
          ignore-vulns: ""

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      # pnpm-lock.yaml is the whole input, so nothing is installed first. A
      # moderate advisory in build-only tooling is not worth stopping a merge
      # for; high is.
      - name: Audit the frontend lockfile
        run: pnpm audit --audit-level=high
