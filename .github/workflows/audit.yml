name: Dependency audit

# Deliberately not a step in quality-gate.yml. That workflow also gates the tag
# push, through docker.yml's verify job, so an advisory published between merge
# and release — or an advisory feed that is merely down — would stop the image
# being built for a commit CI already passed. An advisory is news about code
# that merged days ago; it belongs on its own trigger.
#
# The weekly run is how news reaches anyone without a code change: its failure
# mails whoever last edited the cron below, which is the only notification a
# scheduled run has.
on:
  pull_request:
    branches: [main]
  schedule:
    # Off the hour, where every other repository's cron is queued.
    - cron: "23 6 * * 1"

concurrency:
  group: audit-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Extras included: a vulnerable dev tool still runs on this runner and on
      # every contributor's machine. Hashes are omitted because the audit below
      # resolves nothing that could verify them.
      - name: Export what uv.lock pins
        run: uv export --locked --all-extras --no-emit-project --no-hashes --output-file requirements-audit.txt

      # No severity floor here, unlike the frontend: PyPI advisories often carry
      # no severity at all, so filtering on one would wave an unrated critical
      # through. The waiver is the release valve instead.
      - name: Audit the Python lockfile
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-audit.txt
          no-deps: true
          # An advisory with no fixed release goes here, whitespace separated,
          # with the reason above it. The frontend's equivalent is
          # `pnpm.auditConfig.ignoreCves` in package.json, since pnpm 9 has no
          # flag for it.
          ignore-vulns: ""

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      # pnpm-lock.yaml is the whole input, so nothing is installed first. A
      # moderate advisory in build-only tooling is not worth stopping a merge
      # for; high is.
      - name: Audit the frontend lockfile
        run: pnpm audit --audit-level=high
