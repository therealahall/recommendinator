name: Docker

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

concurrency:
  group: docker-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On PRs: build each image (amd64 only, no push) so a broken Dockerfile
  # fails before merge. Smoke-test the default variant by hitting /api/status.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            dockerfile: Dockerfile
            target: default
            context: .
            smoke_test: true
          - name: ai
            dockerfile: Dockerfile
            target: ai
            context: .
            smoke_test: false
          - name: ollama
            dockerfile: docker/Dockerfile.ollama
            target: ""
            context: docker
            smoke_test: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: true
          tags: recommendinator-${{ matrix.name }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Nothing generates an API token, so CI plays the operator: seed one into
      # the config the container reads, then poll the authenticated path. Proving
      # a 401 is the liveness probe's job, and this step runs that too.
      - name: Smoke test (default variant only)
        if: matrix.smoke_test
        env:
          IMAGE: recommendinator-${{ matrix.name }}:pr-${{ github.event.pull_request.number }}
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          mkdir -p smoke-config
          docker run --rm --entrypoint cat "$IMAGE" /app/config/example.yaml \
            | sed "s|^\( *api_token: \)\"\"|\1\"$TOKEN\"|" > smoke-config/config.yaml
          # The placeholder is in the image and the substitution is here, so a
          # rename would otherwise show up as a start-up timeout.
          grep -q "api_token: \"$TOKEN\"" smoke-config/config.yaml
          docker run -d --name smoke -p 8000:8000 \
            -v "$PWD/smoke-config:/app/config" "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 -H "Authorization: Bearer $TOKEN" \
                http://localhost:8000/api/status > /dev/null; then
              echo "App started after ${i}s"
              # The only place the shipped probe runs in the image that ships
              # it, which is how it went unhealthy for every user unnoticed.
              if ! docker exec smoke python -m src.web.healthcheck; then
                echo "The image's HEALTHCHECK reports unhealthy against a live app"
                docker logs smoke
                docker rm -f smoke
                exit 1
              fi
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start within 30s"
          docker logs smoke
          docker rm -f smoke
          exit 1

  # A tag can be pushed onto any commit on any branch by anyone with write
  # access, or by a stolen token. Establish what the tag is entitled to before
  # anything is built, and hand the answers to publish.
  guard:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      highest_overall: ${{ steps.aliases.outputs.highest_overall }}
      highest_in_major: ${{ steps.aliases.outputs.highest_in_major }}
      highest_in_minor: ${{ steps.aliases.outputs.highest_in_minor }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Defence-in-depth: the workflow's `on.push.tags` filter is `v*`, so a
      # stray `vtest` gets this far. The steps below also read the tag as
      # vMAJOR.MINOR.PATCH, and this is what makes that safe.
      - name: Validate semver tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Tag '$TAG' is not a semver release tag (vMAJOR.MINOR.PATCH); aborting publish."
            exit 1
          }

      # Only history that reached main has been through review and the gate.
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Tagged commit $GITHUB_SHA is not an ancestor of main; aborting publish."
            exit 1
          fi

      # A floating tag may only ever move forward. Publishing a backport must
      # leave `latest` — and `0`, and `0.22` — on the newest release each of
      # them names, or `docker compose pull` hands users a downgrade.
      - name: Decide which floating tags this release may move
        id: aliases
        env:
          TAG: ${{ github.ref_name }}
        run: |
          RELEASES=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
          # The prefixes are literals, and escaped as such: unescaped, `v0.29.`
          # is a pattern that also matches `v0129.`.
          MAJOR_PREFIX="${TAG%%.*}."
          MINOR_PREFIX="${TAG%.*}."
          HIGHEST_OVERALL=$(printf '%s\n' "$RELEASES" | tail -1)
          HIGHEST_IN_MAJOR=$(printf '%s\n' "$RELEASES" | grep -E "^${MAJOR_PREFIX//./\\.}" | tail -1 || true)
          HIGHEST_IN_MINOR=$(printf '%s\n' "$RELEASES" | grep -E "^${MINOR_PREFIX//./\\.}" | tail -1 || true)

          is_tag() {
            if [ "$1" = "$TAG" ]; then echo true; else echo false; fi
          }
          echo "Newest release overall $HIGHEST_OVERALL, under $MAJOR_PREFIX $HIGHEST_IN_MAJOR, under $MINOR_PREFIX $HIGHEST_IN_MINOR"
          {
            echo "highest_overall=$(is_tag "$HIGHEST_OVERALL")"
            echo "highest_in_major=$(is_tag "$HIGHEST_IN_MAJOR")"
            echo "highest_in_minor=$(is_tag "$HIGHEST_IN_MINOR")"
          } >> "$GITHUB_OUTPUT"

  # The gate CI runs, run again on the tagged tree. Nothing else establishes
  # that what is about to be published was ever checked: the version commit is
  # created after CI passed on its parent and pushed with [skip ci].
  verify:
    needs: guard
    uses: ./.github/workflows/quality-gate.yml

  # On version tags: build each image multi-arch and push to GHCR with semver
  # tags (X.Y.Z, X.Y, X, latest) plus the AI variant suffix where applicable.
  publish:
    needs: [guard, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            image: ghcr.io/${{ github.repository_owner }}/recommendinator
            dockerfile: Dockerfile
            target: default
            context: .
            tag_suffix: ""
          - name: ai
            image: ghcr.io/${{ github.repository_owner }}/recommendinator
            dockerfile: Dockerfile
            target: ai
            context: .
            tag_suffix: "-ai"
          - name: ollama
            image: ghcr.io/${{ github.repository_owner }}/recommendinator-ollama
            dockerfile: docker/Dockerfile.ollama
            target: ""
            context: docker
            tag_suffix: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ matrix.image }}
          flavor: |
            suffix=${{ matrix.tag_suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.guard.outputs.highest_in_minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.guard.outputs.highest_in_major == 'true' }}
            type=raw,value=latest,enable=${{ needs.guard.outputs.highest_overall == 'true' }}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}-publish
          cache-to: type=gha,scope=${{ matrix.name }}-publish,mode=max
          provenance: true
          sbom: true

      - name: Verify multi-arch manifest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            | grep -E 'linux/(amd64|arm64)' \
            | tee /tmp/platforms.txt
          grep -q 'linux/amd64' /tmp/platforms.txt
          grep -q 'linux/arm64' /tmp/platforms.txt
