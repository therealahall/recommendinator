name: Docker

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

# One group for every tag: two releases in flight decide their aliases before
# either builds, and the slower one takes `latest`. Serialising costs a
# cancelled middle run when three are queued: a missing image, louder than a
# stale alias.
concurrency:
  group: docker-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On PRs: build the image (amd64 only, no push) so a broken Dockerfile fails
  # before merge, then smoke-test it.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: recommendinator:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=default
          cache-to: type=gha,scope=default,mode=max

      # /api/auth/session is the one route a signed-out caller may reach, and it
      # reads the database to answer, so a 200 is a server that came all the way
      # up. Proving a 401 is the liveness probe's job, and this step runs that
      # too.
      - name: Smoke test
        env:
          IMAGE: recommendinator:pr-${{ github.event.pull_request.number }}
        run: |
          mkdir -p smoke-config
          docker run --rm --entrypoint cat "$IMAGE" /app/example.yaml > smoke-config/config.yaml
          docker run -d --name smoke -p 8000:8000 \
            -v "$PWD/smoke-config:/app/config" "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 \
                http://localhost:8000/api/auth/session > /dev/null; then
              echo "App started after ${i}s"
              # The only place the shipped probe runs in the image that ships
              # it, which is how it went unhealthy for every user unnoticed.
              if ! docker exec smoke python -m src.web.healthcheck; then
                echo "The image's HEALTHCHECK reports unhealthy against a live app"
                docker logs smoke
                docker rm -f smoke
                exit 1
              fi
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start within 30s"
          docker logs smoke
          docker rm -f smoke
          exit 1

  # Binds the tag the release job pushes: what it may publish, decided before
  # anything is built. Not anyone else's — a push runs the workflow at the
  # pushed ref, so an edited docker.yml runs itself, guard job and all. The
  # ruleset the alias decision names is what keeps that tag from existing.
  guard:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      highest_overall: ${{ steps.aliases.outputs.highest_overall }}
      highest_in_major: ${{ steps.aliases.outputs.highest_in_major }}
      highest_in_minor: ${{ steps.aliases.outputs.highest_in_minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Defence-in-depth: the workflow's `on.push.tags` filter is `v*`, so a
      # stray `vtest` gets this far. The steps below also read the tag as
      # vMAJOR.MINOR.PATCH, and this is what makes that safe.
      - name: Validate semver tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Tag '$TAG' is not a semver release tag (vMAJOR.MINOR.PATCH); aborting publish."
            exit 1
          }

      # Only history that reached main has been through review and the gate.
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Tagged commit $GITHUB_SHA is not an ancestor of main; aborting publish."
            exit 1
          fi

      # A floating tag may only ever move forward. Publishing a backport must
      # leave `latest` — and `0`, and `0.22` — on the newest release each of
      # them names, or `docker compose pull` hands users a downgrade.
      - name: Decide which floating tags this release may move
        id: aliases
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Only tags that reached main are releases. A stray `v0.29.1` on a
          # feature branch published nothing, and counting it would freeze every
          # alias behind a commit no later release descends from.
          RELEASES=$(git tag --list --merged refs/remotes/origin/main \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
          MAJOR_PREFIX="${TAG%%.*}."
          MINOR_PREFIX="${TAG%.*}."
          # A refusal message is the only artefact a refusal leaves, so it names
          # the registry alias that did not move — `0.29`, not the tag `v0.29.0`.
          VERSION="${TAG#v}"

          # Version order compares tag *names*, and a tag is pushable onto any
          # commit that reached main. So an alias moves only to a release that
          # is the newest its scope names and descends from every other release
          # there — the top-named one is not the holder once a refusal happened.

          # Left open: every answer here reads tag history, which a creation on
          # an unguarded commit, a force-push or a deletion rewrites. Only one
          # ruleset closes all three — refs/tags/v* restricting creations,
          # updates and deletions, bypassed by the release identity alone.
          #
          # Deciding the aliases after the build instead, with a post-build
          # `imagetools create`, is the more correct design: it would read the
          # tag set once every image exists. Too large a change for this one.
          may_move() {
            # `$1` is a literal prefix: unescaped, `v0.29.` matches `v0129.` too.
            SCOPE=$(printf '%s\n' "$RELEASES" | grep -E "^${1//./\\.}" || true)
            if [ "$(printf '%s\n' "$SCOPE" | tail -1)" != "$TAG" ]; then
              echo "$2 stays put: $TAG is not the newest release it names." >&2
              echo false
              return
            fi
            for OTHER in $(printf '%s\n' "$SCOPE" | grep -vxF "$TAG" || true); do
              if ! git merge-base --is-ancestor "$OTHER^{commit}" "$TAG^{commit}"; then
                echo "$2 stays on $OTHER: $TAG does not descend from it." >&2
                echo false
                return
              fi
            done
            echo true
          }

          {
            echo "highest_overall=$(may_move '' latest)"
            echo "highest_in_major=$(may_move "$MAJOR_PREFIX" "${VERSION%%.*}")"
            echo "highest_in_minor=$(may_move "$MINOR_PREFIX" "${VERSION%.*}")"
          } >> "$GITHUB_OUTPUT"

  # The gate CI runs, run again on the tagged tree. The version commit has its
  # own CI run, but nothing ties it to this workflow — it may still be running
  # when publish starts.
  verify:
    needs: guard
    uses: ./.github/workflows/quality-gate.yml

  # On version tags: build the image multi-arch and push to GHCR with semver
  # tags (X.Y.Z, X.Y, X, latest).
  publish:
    needs: [guard, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/recommendinator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # `latest=auto`, the default, appends `latest` to any non-prerelease
          # semver tag on its own — the guard's decision to make. Off, the
          # guarded entry below is the only source.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.guard.outputs.highest_in_minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.guard.outputs.highest_in_major == 'true' }}
            type=raw,value=latest,enable=${{ needs.guard.outputs.highest_overall == 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=default-publish
          cache-to: type=gha,scope=default-publish,mode=max
          provenance: true
          sbom: true

      - name: Verify multi-arch manifest
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            | grep -E 'linux/(amd64|arm64)' \
            | tee /tmp/platforms.txt
          grep -q 'linux/amd64' /tmp/platforms.txt
          grep -q 'linux/arm64' /tmp/platforms.txt
