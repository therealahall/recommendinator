name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Every write here — the branch push, the tag push and the release creation —
    # goes through the GH_TOKEN PAT, which is also what carries the branch
    # protection bypass. The job's own token needs nothing beyond read.
    permissions:
      contents: read

    steps:
      # A workflow_run job with no ref checks out whatever main tips at when it
      # starts, which is not necessarily the commit whose CI passed. Pin it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Release only the commit CI validated
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_TIP=$(git rev-parse refs/remotes/origin/main)
          if [ "$MAIN_TIP" != "$VALIDATED_SHA" ]; then
            echo "CI validated $VALIDATED_SHA but main is now at $MAIN_TIP."
            echo "Releasing would tag code no CI run has passed; the newer commit's own run releases it."
            exit 1
          fi
          # The pinned checkout left HEAD detached, and semantic-release commits
          # and pushes the branch it is standing on.
          git switch -C main "$VALIDATED_SHA"
          git branch --set-upstream-to=origin/main main

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          enable-cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Configure git for semantic-release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Bumps the version and regenerates CHANGELOG.md and uv.lock, then commits
      # and tags locally. Nothing is pushed here: the bumped tree has been
      # through no check at all yet, and an unpushed tag is still recoverable.
      # psr also does not create the GitHub release (--no-vcs-release), so the
      # step below can attach docker-compose.yml at creation time — the repo has
      # immutable releases enabled, which forbids adding assets afterwards.
      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: >-
          uv run --frozen --extra dev python -m semantic_release version
          --no-push --commit --tag --no-vcs-release

      # Empty output when no commit since the last tag was releasable, which is
      # an ordinary push rather than a failure. Every step after this one is
      # conditioned on it, so "nothing to release" stays declarative instead of
      # being a shell exit code somebody has to get right.
      - name: Identify the release tag
        id: released
        run: |
          TAGS=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          TAG=""
          if [ -n "$TAGS" ]; then
            TAG=$(printf '%s\n' "$TAGS" | head -1)
            OTHERS=$(printf '%s\n' "$TAGS" | tail -n +2)
            if [ -n "$OTHERS" ]; then
              echo "WARNING: HEAD carries more than one semver tag ($TAGS); releasing $TAG."
            fi
          fi
          echo "Release tag at HEAD: ${TAG:-none}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The build_command rewrote uv.lock. If that left the lock disagreeing with
      # pyproject.toml, every `uv sync --locked` downstream fails — the image
      # build included — and the tag would already be public by then.
      - name: Verify the bumped tree
        if: steps.released.outputs.tag != ''
        run: uv sync --locked --extra dev

      # The gate reruns on the tagged tree in docker.yml, after this push: a tag
      # and its GitHub release are public with no images until someone deletes
      # them. Rerunning it here would put the suite in the job holding the PAT.
      - name: Push the version commit and tag
        if: steps.released.outputs.tag != ''
        env:
          NEW_TAG: ${{ steps.released.outputs.tag }}
        run: |
          git push origin main
          git push origin "refs/tags/$NEW_TAG"

      - name: Create GitHub release with docker-compose.yml asset
        if: steps.released.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NEW_TAG: ${{ steps.released.outputs.tag }}
        run: |
          VERSION="${NEW_TAG#v}"

          # Recovery path: if a prior partial run already created the release,
          # delete it so we can recreate it with the asset bundled at creation.
          # Tag is preserved (--cleanup-tag=false). Safe for immutable releases
          # too — deletion is allowed; only post-creation mutation is forbidden.
          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            echo "Release $NEW_TAG already exists; deleting so it can be recreated with asset."
            gh release delete "$NEW_TAG" --yes --cleanup-tag=false
          fi

          # Extract the section for this version from CHANGELOG.md
          # (everything between "## vX.Y.Z " and the next "## v" heading).
          NOTES_FILE=$(mktemp)
          awk -v v="$VERSION" '
            $0 ~ "^## v"v"( |$)" {found=1; next}
            found && /^## v/ {exit}
            found {print}
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "Could not extract changelog section for $VERSION; falling back to auto-generated notes."
            gh release create "$NEW_TAG" --title "$NEW_TAG" --generate-notes docker-compose.yml
          else
            gh release create "$NEW_TAG" --title "$NEW_TAG" --notes-file "$NOTES_FILE" docker-compose.yml
          fi
          echo "Created release $NEW_TAG with docker-compose.yml asset"
