name: Quality gate

# One definition, called by CI for branches and pull requests and by Docker
# before it publishes a tag. A separate copy for the tag path would let the tree
# that ships be checked by a weaker gate than the tree that was merged.
on:
  workflow_call:

jobs:
  # The second half of the `check / check` status branch protection must
  # require: the calling job's name, then this one. Renaming it needs the same
  # settings edit, and until that lands no merge passes. See ci.yml.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"

      # --locked installs exactly what uv.lock pins and fails rather than
      # re-resolving, so a pull request cannot have a dependency the lockfile
      # does not name installed into the runner.
      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      # The gate lives in the Makefile so this workflow and the command
      # contributors run cannot drift apart. PYTHON points make at the
      # interpreter uv provisioned; make installs the frontend dependencies.
      - name: Run the quality gate
        run: make check PYTHON=.venv/bin/python

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: docker

      # The deployment on its own, then the override contributors copy — named
      # with -f because the .example suffix is not one compose picks up itself.
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.override.yml.example config --quiet

  interpreters:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run the Python checks
        run: make check-python PYTHON=.venv/bin/python
