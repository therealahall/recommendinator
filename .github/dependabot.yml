# Grouped hard: ungrouped, four ecosystems open tens of pull requests a week,
# and automation nobody reviews is worse than none. Security updates ignore the
# ceiling, so an advisory still lands its own the day it arrives.
#
# `chore` throughout because python-semantic-release parses the type, and `fix`
# would cut a patch release claiming someone else's bump as ours.
version: 2

updates:
  # Dependabot rewrites the `# vX.Y.Z` along with the sha when they share a
  # line, so the pinning convention survives its pull requests.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  # `uv`, not `pip`: `pip` reads pyproject.toml and leaves uv.lock behind, and
  # every install here — the gate, the image — is `--locked` against that file.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  # pnpm's YAML value is `npm`; it is pnpm-lock.yaml that gets updated.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      frontend:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  # The Dockerfile's tag@sha256 bases, including the uv stage copied from GHCR.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
